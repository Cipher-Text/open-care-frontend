name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

  vulnerability:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: vulnerability
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Environment Name
        id: env_name
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "ENV_NAME=qa" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
          fi

      - name: Build and Tag Docker Images
        run: |
          docker build -f Dockerfile.${{ env.ENV_NAME }} -t ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME }}-latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME }}-latest \
            ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME }}-${{ github.sha }}

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME
            }}-latest
          trivyignores: .trivyignore
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME }}-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ env.ENV_NAME }}-${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref
      == 'refs/heads/qa')
    steps:
      - name: Determine Environment Name
        id: env_name
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "env_name=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "ENV_NAME=qa" >> $GITHUB_ENV
            echo "env_name=qa" >> $GITHUB_OUTPUT
          fi

      - name: SSH into Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          timeout: 60s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ steps.env_name.outputs.env_name }}-latest
            sudo docker stop open-care-frontend-${{ steps.env_name.outputs.env_name }} || true
            sudo docker rm open-care-frontend-${{ steps.env_name.outputs.env_name }} || true
            sudo docker system prune -af
            sudo docker run -d --name open-care-frontend-${{ steps.env_name.outputs.env_name }} -p 5175:5175 --restart always \
              --env-file /home/sadman/open-care-frontend/.env.${{ steps.env_name.outputs.env_name }} \
              ${{ secrets.DOCKER_USERNAME }}/open-care-frontend:${{ steps.env_name.outputs.env_name }}-latest
