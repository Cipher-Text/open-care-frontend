name: Secret scan

# Fails a push or pull request that adds something that looks like a key, token or password. It reads only the new
# commits: secrets already in the history are handled by rotating them (docs/planning/IMPLEMENTATION_ORDER.md item 0.2).
on:
  push:
    branches: [dev, qa, master, main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the new commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="HEAD~1..HEAD"; else RANGE="$BEFORE..${{ github.sha }}"; fi
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect \
            --source /repo --config /repo/.gitleaks.toml --log-opts="$RANGE" --redact --no-banner --verbose
